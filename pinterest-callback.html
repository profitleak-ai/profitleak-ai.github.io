<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ربط Pinterest — ProfitLeak AI</title>
<meta name="robots" content="noindex"><style>body{font-family:system-ui,Segoe UI,Tahoma;background:#0a0f1e;color:#e6ecf7;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.c{max-width:640px;padding:32px;background:#121a33;border:1px solid #2a3760;border-radius:20px;text-align:center}
code{display:block;background:#0b1326;color:#ffd166;padding:16px;border-radius:12px;font-size:15px;word-break:break-all;margin:16px 0;direction:ltr}
button{background:#ffd166;color:#0a0f1e;border:0;padding:12px 22px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}</style></head>
<body><div class="c"><h2>✅ تم ربط Pinterest</h2><p>انسخي هذا الرمز وألصقيه في المحادثة:</p><code id="k">…</code><button onclick="navigator.clipboard.writeText(document.getElementById('k').textContent);this.textContent='تم النسخ ✅'">نسخ الرمز</button>
<p id="e" style="color:#f87171"></p></div>
<script>const q=new URLSearchParams(location.search);const c=q.get('code');if(c){document.getElementById('k').textContent=c}else{document.getElementById('k').textContent='لا يوجد رمز';document.getElementById('e').textContent=q.get('error_description')||q.get('error')||''}</script></body></html>
