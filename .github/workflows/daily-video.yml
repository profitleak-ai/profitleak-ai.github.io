name: 🎬 الفيديو اليومي

on:
  schedule:
    - cron: '0 12 * * *'   # 13:00 بتوقيت المغرب (بعد منشور الصور بنصف ساعة)
  workflow_dispatch:
    inputs:
      index:
        description: 'رقم المنشور (اتركيه فارغًا للاختيار التلقائي)'
        required: false
      template:
        description: 'القالب (فارغ = تلقائي)'
        required: false
        default: ''
        type: choice
        options: ['', midnight, royal, emerald, sunset]
      publish_at:
        description: 'نشر مجدول على يوتيوب (UTC، مثل 2026-10-13T12:00:00Z) — فارغ = فوري'
        required: false
        default: ''
      force:
        description: 'أعد النشر حتى لو نُشر اليوم'
        required: false
        default: false
        type: boolean
      skip_telegram:
        description: 'تجاهُل النشر في تلغرام (للاختبار)'
        required: false
        default: false
        type: boolean
      skip_youtube:
        description: 'تجاهُل النشر في يوتيوب'
        required: false
        default: false
        type: boolean

concurrency:
  group: poster-state
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت الحزم
        run: pip install --quiet Pillow imageio-ffmpeg fonttools edge-tts gradio_client

      - name: 🎞️ توليد الفيديو ونشره
        env:
          SITE: https://profitleakaii.qd.je
          SLOT: morning
          SHORT_SLOT: '1'
          NTFY_TOPIC: profitleak-alerts-34d2c8377c
          INDEX: ${{ github.event.inputs.index }}
          VIDEO_TEMPLATE: ${{ github.event.inputs.template }}
          SKIP_TELEGRAM: ${{ github.event.inputs.skip_telegram }}
          FORCE_VIDEO: ${{ github.event.inputs.force }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          SKIP_YOUTUBE: ${{ github.event.inputs.skip_youtube }}
        run: python3 auto-poster/publish_video.py

      - name: حفظ الحالة (منع تكرار الفيديو)
        run: |
          bash auto-poster/save_state.sh
