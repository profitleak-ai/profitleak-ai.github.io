name: 📡 مراقبة تفعيل بينتوريست

on:
  schedule:
    - cron: '23 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: تثبيت حزم الوسائط (لأول دفعة)
        run: pip install --quiet Pillow imageio-ffmpeg fonttools
      - name: فحص حالة التطبيق
        env:
          SITE: https://profitleakaii.qd.je
          SLOT: morning
          NTFY_TOPIC: profitleak-alerts-34d2c8377c
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ProfitLeak AI
        run: python3 auto-poster/watch_pinterest.py
