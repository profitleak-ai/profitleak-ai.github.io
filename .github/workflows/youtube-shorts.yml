name: ▶️ شورتس إضافية (صباح + مساء)

on:
  schedule:
    - cron: '0 9 * * *'    # 10:00 المغرب — الشورت الأول
    - cron: '0 17 * * *'   # 18:00 المغرب — الشورت الثالث (الثاني هو فيديو 13:00)
  workflow_dispatch:
    inputs:
      slot:
        description: 'الحصة (0 = 10:00 عربي، 2 = 18:00 عربي)'
        required: false
        default: '0'
      template:
        description: 'القالب (فارغ = تلقائي)'
        required: false
        default: ''
        type: choice
        options: ['', midnight, royal, emerald, sunset]
      publish_at:
        description: 'نشر مجدول على يوتيوب (UTC، مثل 2026-10-13T12:00:00Z) — فارغ = فوري'
        required: false
        default: ''
      force:
        description: 'أعد النشر حتى لو نُشر اليوم'
        required: false
        default: false
        type: boolean

concurrency:
  group: poster-state
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: تثبيت الحزم
        run: pip install --quiet Pillow imageio-ffmpeg fonttools edge-tts gradio_client
      - name: تحديد الحصة
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT;
          elif [ "$(date -u +%H)" -lt 12 ]; then echo "slot=0" >> $GITHUB_OUTPUT;
          else echo "slot=2" >> $GITHUB_OUTPUT; fi
      - name: 🎞️ توليد الشورت ونشره (يوتيوب + تلغرام)
        env:
          SITE: https://profitleakaii.qd.je
          SLOT: morning
          NTFY_TOPIC: profitleak-alerts-34d2c8377c
          SHORT_SLOT: ${{ steps.slot.outputs.slot }}
          VIDEO_TEMPLATE: ${{ github.event.inputs.template }}
          FORCE_VIDEO: ${{ github.event.inputs.force }}
          SKIP_PINTEREST: 'true'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PUBLISH_AT: ${{ github.event.inputs.publish_at }}
        run: python3 auto-poster/publish_video.py
      - name: حفظ الحالة
        run: |
          bash auto-poster/save_state.sh
